name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        run: go build -v ./...

      - name: Build ARM64 (TV Box)
        run: GOOS=linux GOARCH=arm64 go build -o cipher-scope-arm64 .

      - name: Vet
        run: go vet ./...
